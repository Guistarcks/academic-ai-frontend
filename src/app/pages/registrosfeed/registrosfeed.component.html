<video autoplay muted loop class="bg-video">
  <source src="./assets/video/backgroud.mp4" type="video/mp4">
  Seu navegador não suporta vídeo em background.
</video>
<div class="container-fluid animated fadeInUp px-4">
  <div class="row mt-5">
    <!-- COLUMNA 1: FORMULARIO -->
    <div class="col-lg-6">
      <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-header bg-dark text-white">
          <h4 class="text-center font-weight-light my-2">
            <img src="assets/images/ai-service.gif" alt="IA" class="img-fluid mb-3 d-block mx-auto" style="width: 50px;">Sistema de Acompanhamento Acadêmico
          </h4>
        </div>
        <div class="card-body">
          <form (ngSubmit)="submitData()" #form="ngForm">
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-floating mb-3 mb-md-0">
                  <input 
                    class="form-control" 
                    id="name" 
                    type="text" 
                    [(ngModel)]="name" 
                    name="name" 
                    placeholder="Seu nome"
                    readonly 
                    style="background-color: #f8f9fa; cursor: not-allowed;" />
                  <label for="name">Nome (Usuário Logueado)</label>
                </div>
              </div>
            
               <div class="col-md-3">
                 <div class="form-floating mb-3 mb-md-0">
                <input
                class="form-control"
                id="notas"
                type="number"
                [(ngModel)]="gradeInput"
                (ngModelChange)="onGradeInputChange($event)"
                name="gradeInput">
                <label for="notas">Notas</label>
                </div>
              </div>

              <div class="col-md-3">
                <div class="form-floating mb-3 mb-md-0">
                <p class="mt-2">Notas: {{ grades.join(', ') }}</p>
                </div>
              </div>
            </div>

            <div class="form-floating mb-3">
              <input id="goals" type="text" [(ngModel)]="goals" name="goals" class="form-control" placeholder="Indique suas metas" />
              <label for="goals">Metas:</label>
            </div>

            <div class="form-floating mb-3">
              <textarea class="form-control" id="feedback" rows="5" [(ngModel)]="feedback" name="feedback" placeholder="Feedback do aluno"></textarea>
              <label for="feedback">Feedback:</label>
            </div>

            <div class="mt-4 mb-0 d-grid">
              <button class="login100-form-btn" type="submit" [disabled]="loading">
                <i class="fas fa-paper-plane me-2"></i>
                {{ loading ? 'Analisando...' : 'Enviar para Análise' }}
              </button>
            </div>
          </form>

          <!-- Mensaje de estado -->
          <p *ngIf="message && !analysisResult" class="mt-3 text-center text-success">
            <i class="fas fa-info-circle me-2"></i>{{ message }}
          </p>

          <!-- Resultado del análisis con efecto de escritura -->
          <div *ngIf="analysisResult" class="mt-4 p-4 border rounded shadow-sm bg-light animated fadeIn">
            <h5 class="mb-3 fw-semibold text-primary">
              <i class="fas fa-chart-line me-2"></i>📊 Resultado da Análise:
            </h5>
            <div class="bg-white p-4 rounded border" style="max-height: 400px; overflow-y: auto; white-space: pre-wrap; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6;">
              {{ analysisResult }}<span class="typing-cursor">|</span>
            </div>

            <!-- Botones Guardar y Cancelar (solo aparecen cuando termina el análisis) -->
            <div *ngIf="showSaveButtons" class="mt-4 d-flex justify-content-end gap-3 animated fadeIn">
              <button 
                type="button" 
                class="btn btn-danger btn-lg px-4"
                (click)="cancelarAnalisis()">
                <i class="fas fa-times me-2"></i>Cancelar
              </button>
              <button 
                type="button" 
                class="btn btn-success btn-lg px-4"
                (click)="guardarAnalisis()">
                <i class="fas fa-save me-2"></i>Guardar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- COLUMNA 2: TABLA DE HISTÓRICO -->
    <div class="col-lg-6">
      <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-header bg-dark text-white">
          <h4 class="text-center font-weight-light my-2">
             <img src="assets/images/ai-layer.gif" alt="IA" class="img-fluid mb-3 d-block mx-auto" style="width: 50px;">Histórico de Análises
          </h4>
        </div>
        <div class="card-body">
          <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
            <table class="table table-hover table-striped">
              <thead class="bg-dark text-white">
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Data</th>
                  <th scope="col">Nome</th>
                  <th scope="col">Notas</th>
                  <th scope="col">Ações</th>
                </tr>
              </thead>
              <tbody>
                <!-- Aquí irán los datos del histórico -->
                <tr>
                  <td colspan="5" class="text-center text-muted py-5">
                    <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                    <p>Nenhum registro encontrado</p>
                    <small>Os registros salvos aparecerão aqui</small>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
